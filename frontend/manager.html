<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Managerial Analytics Panel - Ocupación de Rutas</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 2rem; background: #f1f5f9; color: #0f172a; }
    .container { max-width: 700px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    h1 { margin-top: 0; color: #1e3a8a; }
    .form-group { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .form-control { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 0.25rem; }
    input, button { padding: 0.6rem 0.8rem; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { background: #1e40af; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #1e3a8a; }
    .metric-card { margin-top: 1.5rem; padding: 1.5rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; text-align: center; display: none; }
    .metric-title { font-size: 1.1rem; color: #1e40af; margin-bottom: 0.5rem; }
    .metric-value { font-size: 2.8rem; font-weight: 800; color: #1d4ed8; }
    .metric-details { margin-top: 1rem; font-size: 0.95rem; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Panel Gerencial de Analítica</h1>
    <p>Consulte el factor de ocupación histórico procesado con AWS EMR y Amazon Athena.</p>

    <div class="form-group">
      <div class="form-control">
        <label>Ruta</label>
        <input type="text" data-testid="manager-route" placeholder="BOG-MDE" />
      </div>
      <div class="form-control">
        <label>Mes</label>
        <input type="text" data-testid="manager-month" placeholder="2024-05" />
      </div>
      <div class="form-control" style="justify-content: flex-end;">
        <button type="button" data-testid="manager-load" onclick="loadOccupancy()">Consultar</button>
      </div>
    </div>

    <div id="metric-card" class="metric-card">
      <div class="metric-title">Factor de Ocupación</div>
      <div data-testid="occupancy-value" class="metric-value">0.0%</div>
      <div id="metric-details" class="metric-details"></div>
    </div>
  </div>

  <script>
    async function loadOccupancy() {
      const route = document.querySelector('[data-testid="manager-route"]').value.trim();
      const month = document.querySelector('[data-testid="manager-month"]').value.trim();
      const card = document.getElementById("metric-card");
      const valEl = document.querySelector('[data-testid="occupancy-value"]');
      const detEl = document.getElementById("metric-details");

      if (!route || !month) {
        alert("Por favor ingrese la ruta y el mes.");
        return;
      }

      valEl.innerText = "Cargando...";
      card.style.display = "block";

      try {
        const res = await fetch(`/analytics/occupancy?route=${encodeURIComponent(route)}&month=${encodeURIComponent(month)}`);
        if (!res.ok) {
          throw new Error(res.status === 404 ? "No hay datos para la ruta y mes especificados." : `Error ${res.status}`);
        }
        const data = await res.json();
        const percent = (data.occupancy * 100).toFixed(1) + "%";
        valEl.innerText = percent;
        detEl.innerText = `Asientos vendidos: ${data.seats_sold.toLocaleString()} / Capacidad total: ${data.seats_capacity.toLocaleString()}`;
      } catch (err) {
        valEl.innerText = "N/A";
        detEl.innerText = err.message;
      }
    }
  </script>
</body>
</html>
